<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="سجلي.. تنظيم المواعيد، وإدارة الدعوات..">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="سجلي">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>سجلي.. تنظيم المواعيد، وإدارة الدعوات..</title>
  <link rel="manifest" href="manifest.json">

  <!-- Cropper.js for image_cropper web support -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <style>
    /* Prevents cropper from overflowing and appearing distorted on web */
    .cropper-container {
      max-width: 100% !important;
      max-height: 70vh !important;
    }
    img {
      max-width: 100%;
      max-height: 60vh !important;
      object-fit: contain;
    }

    /* Loading overlay styling */
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #111827; /* Dark background matching AppColors.darkBackground */
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      direction: rtl;
    }

    .loader-container {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }

    .logo-pulse {
      animation: pulse 1.8s infinite ease-in-out;
      margin-bottom: 20px;
    }

    .loading-title {
      color: #F9FAFB;
      font-size: 28px;
      font-weight: bold;
      margin: 0 0 8px 0;
      letter-spacing: 0.5px;
    }

    .loading-subtitle {
      color: #9CA3AF;
      font-size: 14px;
      margin: 0 0 24px 0;
    }

    .progress-bar-container {
      width: 160px;
      height: 4px;
      background-color: #1F2937;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-value {
      width: 100%;
      height: 100%;
      background-color: #3B82F6;
      border-radius: 10px;
      animation: loading 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0% {
        transform: scale(0.95);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.05);
        opacity: 1;
        filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.6));
      }
      100% {
        transform: scale(0.95);
        opacity: 0.8;
      }
    }

    @keyframes loading {
      0% {
        transform: translateX(100%);
      }
      50% {
        transform: translateX(-20%);
      }
      100% {
        transform: translateX(-100%);
      }
    }
  </style>
</head>

<body>
  <div id="loading-overlay">
    <div class="loader-container">
      <div class="logo-pulse">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 4H5C3.89543 4 3 4.89543 3 6V18C3 19.1046 3.89543 20 5 20H19C20.1046 20 21 19.1046 21 18V6C21 4.89543 20.1046 4 19 4Z" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 2V6" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 2V6" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 10H21" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h2 class="loading-title">سجلي</h2>
      <p class="loading-subtitle">جاري فتح الصفحة بأمان...</p>
      <div class="progress-bar-container">
        <div class="progress-bar-value"></div>
      </div>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>

name: sijilli
description: تطبيق مواعيد اجتماعي
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pocketbase: ^0.23.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  image_picker: ^1.2.1
  image_cropper: ^11.0.0
  path_provider: ^2.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hijri: ^3.0.0
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  gal: ^2.3.2
  dio: ^5.9.0
  flutter_local_notifications: ^20.0.0
  timezone: ^0.10.1
  google_fonts: ^8.0.0
  adhan: ^2.0.0+1
  geolocator: ^14.0.2
  timeago: ^3.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  # إزالة adaptive icon مؤقتاً
  # adaptive_icon_background: "#3B82F6"
  # adaptive_icon_foreground: "assets/logo/logo.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/logo/